name: CD

on:
  push:
    branches: [main]
    tags: ['v*']

# Serializa as execucoes para que o bump de versao nunca aconteca em paralelo.
concurrency:
  group: cd-main
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  version:
    name: Versionar release
    # Apenas pushes na main geram uma nova versao. Tags v* manuais pulam este job.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      version: ${{ steps.next.outputs.version }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Calcular proxima versao (semver patch)
        id: next
        shell: bash
        run: |
          set -euo pipefail
          latest="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)"
          if [ -z "$latest" ]; then
            next="v1.0.0"
          else
            base="${latest#v}"
            major="${base%%.*}"
            rest="${base#*.}"
            minor="${rest%%.*}"
            patch="${rest#*.}"
            next="v${major}.${minor}.$((patch + 1))"
          fi
          echo "version=${next}" >> "$GITHUB_OUTPUT"
          echo "Proxima versao: ${next}"

      - name: Criar tag e release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "Tag $VERSION ja existe; nada a criar."
          else
            git tag -a "$VERSION" -m "Release $VERSION"
            git push origin "$VERSION"
          fi
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION ja existe; nada a criar."
          else
            gh release create "$VERSION" --generate-notes --title "$VERSION"
          fi

  deploy:
    name: Build & Push Docker Image
    needs: version
    # Roda na main (apos versionar) e tambem em tags v* manuais.
    if: always() && needs.version.result != 'failure' && needs.version.result != 'cancelled'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          # Usa GHCR_TOKEN (PAT com write:packages) quando configurado.
          # Fallback: GITHUB_TOKEN, que exige acesso Write do repositorio
          # ao pacote em Package settings > Manage Actions access.
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.version.outputs.version || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.version.outputs.version || github.ref_name }}
            type=raw,value=${{ needs.version.outputs.version || github.ref_name }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.nginx
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # APP_VERSION alimenta o rodape da tela de login (appVersion()).
          # Em build disparado por tag, needs.version nao roda: usa o nome da tag.
          build-args: |
            APP_VERSION=${{ needs.version.outputs.version || github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

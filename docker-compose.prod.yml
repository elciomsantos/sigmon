# ============================================
#Producao — Nginx + PHP-FPM 8.4 + MySQL 8.4 LTS
#Para Ubuntu Server (Docker Engine nativo).
#Sem bind mount de codigo: a imagem e auto-contida (build no CI/registry).
#Baseline de hardening conforme ESPECIFICACAO-TECNICA-SEGURANCA-PHP.md (Secoes 33-41, 57)
#
#Uso (servidor Ubuntu — imagem publicada pelo CD):
#   cp .env.prod.example .env       # configurar credenciais
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d --no-build
#
#Build manual (apenas desenvolvimento):
#   docker compose -f docker-compose.prod.yml build app
#   Definir APP_TAG e GITHUB_REPOSITORY para apontar a outra imagem/tag.
#============================================
name: sigmon

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    # log-bin-trust-function-creators=1: o binlog vem habilitado por padrao no
    # MySQL 8 e, sem esta flag, a criacao de proximo_codigo_equipamento() no
    # schema base falha com ERROR 1418 e interrompe o import do dump no meio
    # (deixando de criar triggers, notificacoes, migrations etc.).
    command: ["--event-scheduler=ON", "--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD required}
      MYSQL_DATABASE: ${DB_NAME:-cftv_gml}
      MYSQL_USER: ${DB_USER:-cftv_user}
      MYSQL_PASSWORD: ${DB_PASS:?DB_PASS required}
    # DB acessivel apenas na rede interna (backend), nao publicado no host
    volumes:
      # Dados do MySQL em disco externo (Ubuntu Server: /mnt/sstv-dados).
      # Ajuste DB_DATA_PATH no .env se o ponto de montagem for diferente.
      - ${DB_DATA_PATH:-/mnt/sstv-dados/mysql}:/var/lib/mysql
      - ./config/DB/cftv_gml.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      # A primeira inicializacao (initdb + import do schema) pode levar
      # varios minutos em disco mecanico/RAID. Sem isso, o healthcheck
      # marca o banco como unhealthy antes de terminar e o app nao sobe.
      start_period: 300s
    networks:
      - backend
    # Hardening: nao-root (mysql UID 999), capabilities minimas, read-only onde possivel
    user: "999:999"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /var/run/mysqld
    mem_limit: 1g
    cpus: "1.0"
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  app:
    # Imagem do registry GHCR (build no CD) OU build local.
    # GHCR exige nome de imagem minusculo (por isso sigmon em minusculas).
    image: ghcr.io/${GITHUB_REPOSITORY:-defesatecnologia-lang/sigmon}:${APP_TAG:-latest}
    build:
      context: .
      dockerfile: docker/Dockerfile.nginx
    restart: unless-stopped
    ports:
      # Porta HTTP da aplicacao (mapeada para 8080 interno).
      # Ex.: APP_PORT=3000 para acesso via http://10.10.10.208:3000
      - "${APP_PORT:-3000}:8080"
      # Porta HTTPS interna (8443). Publicar apenas se SIGMON_HTTP_ONLY=0.
      - "${APP_HTTPS_PORT:-443}:8443"
    environment:
      SIGMON_ENV: production
      # 1 = serve HTTP direto em APP_PORT (recomendado para acesso por IP sem proxy TLS).
      # 0 = ativa HTTPS em 8443 e redireciona 8080 -> HTTPS.
      SIGMON_HTTP_ONLY: ${SIGMON_HTTP_ONLY:-1}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-cftv_gml}
      DB_USER: ${DB_USER:-cftv_user}
      DB_PASS: ${DB_PASS:?DB_PASS required}
      APP_TIMEZONE: America/Sao_Paulo
      SIGMON_SESSION_TIMEOUT: 3600
      SIGMON_SESSION_ABSOLUTE_TIMEOUT: 28800
      SIGMON_CSP_ALLOW_INLINE_STYLES: 0
      SENTRY_DSN: ${SENTRY_DSN:-}
      # Confiar no proxy Nginx (container app) para headers X-Forwarded-For.
      # Defina em .env para listar os IPs reais dos load balancers (vazio = nenhum).
      PROXY_TRUSTED_IPS: ${PROXY_TRUSTED_IPS:-}
      # Origem(ens) permitida(s) para CORS/same-origin (separadas por virgula).
      # Ex.: http://10.10.10.208:3000
      APP_ALLOWED_ORIGINS: ${APP_ALLOWED_ORIGINS:-}
    volumes:
      - app_storage:/var/www/html/storage
      - app_uploads:/var/www/html/public/uploads
      # DEPLOYED_VERSION e lido pelo appVersion() e exibido no rodape/login
      # (ultima tag implantada). deploy.sh cria o arquivo antes do `up`.
      - ./DEPLOYED_VERSION:/var/www/html/VERSION:ro
      # Certificados TLS (self-signed gerado no entrypoint; CA interna via docker cp)
      - nginx_certs:/etc/nginx/certs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ \"${SIGMON_HTTP_ONLY:-1}\" = \"1\" ] || [ \"${SIGMON_HTTP_ONLY:-1}\" = \"true\" ]; then curl -fsS http://localhost:8080/ >/dev/null || exit 1; else curl -kfsS https://localhost:8443/ >/dev/null || exit 1; fi"
        ]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    networks:
      - frontend
      - backend
    # Hardening: non-root (www-data UID 33), capabilities drop, no-new-privileges, read-only, resource limits
    user: "33:33"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /var/cache/nginx:uid=33,gid=33,mode=0750
      - /var/log/nginx:uid=33,gid=33,mode=0750
      - /var/lib/nginx:uid=33,gid=33,mode=0750
      - /run:uid=33,gid=33,mode=0755
    mem_limit: 1g
    cpus: "1.0"
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  app_storage:
  app_uploads:
  nginx_certs:
